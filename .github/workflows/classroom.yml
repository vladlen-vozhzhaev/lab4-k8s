name: GitHub Classroom Workflow
on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: docker compose build --push

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          sed -i 's/\r$//' ~/.kube/config
          kubectl config set-context --current --namespace=rsoi

      - name: Deploy Postgres
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm upgrade --install postgres bitnami/postgresql \
            -n rsoi -f helm/values/postgres.yaml

      - name: Wait for Postgres
        run: |
          kubectl wait -n rsoi --for=condition=Ready \
            pod/postgres-postgresql-0 --timeout=5m

      - name: Init Postgres databases
        run: |
          POSTGRES_PASSWORD=$(kubectl get secret -n rsoi postgres-postgresql -o jsonpath="{.data.postgres-password}" | base64 -d)
          kubectl exec -n rsoi postgres-postgresql-0 -- env PGPASSWORD="$POSTGRES_PASSWORD" \
            psql -U postgres -c "CREATE USER program WITH PASSWORD 'test';" || true
          for db in ratings libraries reservations; do
            kubectl exec -n rsoi postgres-postgresql-0 -- env PGPASSWORD="$POSTGRES_PASSWORD" \
              psql -U postgres -c "CREATE DATABASE $db OWNER program;" || true
            kubectl exec -n rsoi postgres-postgresql-0 -- env PGPASSWORD="$POSTGRES_PASSWORD" \
              psql -U postgres -d $db -c "GRANT ALL ON SCHEMA public TO program;" || true
            kubectl exec -n rsoi postgres-postgresql-0 -- env PGPASSWORD="$POSTGRES_PASSWORD" \
              psql -U postgres -d $db -c "ALTER SCHEMA public OWNER TO program;" || true
          done

      - name: Deploy services
        run: |
          for svc in rating library reservation gateway; do
            helm upgrade --install $svc helm/generic-service \
              -f helm/values/$svc.yaml \
              -n rsoi
          done

      - name: Wait for gateway
        run: |
          kubectl wait -n rsoi -l app.kubernetes.io/name=gateway \
            pod --for=condition=Ready --timeout=5m

      - name: Install Newman
        run: npm install -g newman

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true